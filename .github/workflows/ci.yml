# AIDD-S029: 3중 스택 CI 품질 게이트
# FR-8.3/8.4 (보안·크기 스캔) + FR-4.3 (커버리지 80%+)
# Java: S010 결정에 따라 이연 — 조건부 실행으로 포함 (비활성)
name: AIDD CI Quality Gates

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

env:
  COVERAGE_THRESHOLD: 80

jobs:
  # ────────────────────────────────────────
  # 스택 감지
  # hashFiles() 는 러너 워크스페이스가 필요해 job 레벨 if: 에서 쓸 수 없다.
  # 사용 시 GitHub 이 워크플로 검증에서 거부하고, 어떤 job 도 생성되지 않은 채
  # 0초 만에 실패한다 (실행 이름이 워크플로 name 대신 파일 경로로 표시됨).
  # 따라서 감지는 별도 job 에서 수행하고 결과만 output 으로 넘긴다.
  # ────────────────────────────────────────
  detect:
    name: "스택 감지"
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.detect.outputs.python }}
      node: ${{ steps.detect.outputs.node }}
      java: ${{ steps.detect.outputs.java }}
    steps:
      - uses: actions/checkout@v4

      - id: detect
        run: |
          PY=false
          if [[ -f pyproject.toml || -f setup.py ]] || compgen -G 'requirements*.txt' > /dev/null; then
            PY=true
          fi
          NODE=false
          [[ -f package.json ]] && NODE=true
          JAVA=false
          if [[ -f pom.xml || -f build.gradle || -f build.gradle.kts ]]; then
            JAVA=true
          fi
          echo "python=$PY" >> "$GITHUB_OUTPUT"
          echo "node=$NODE"  >> "$GITHUB_OUTPUT"
          echo "java=$JAVA"  >> "$GITHUB_OUTPUT"
          echo "감지 결과 — python=$PY node=$NODE java=$JAVA"
        shell: bash

  # ────────────────────────────────────────
  # 공통: diff 크기 + 비밀 스캔 (FR-8.3/8.1)
  # ────────────────────────────────────────
  security-scan:
    name: "Security & Size Scan"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 로컬 pre-commit 과 같은 스크립트를 쓴다 — 제외 경로·loc_ok 우회 규칙이
      # 두 곳에 중복 정의되면 반드시 갈라진다.
      - name: "[FR-8.3] PR diff 크기 확인 (≤300 LOC)"
        if: github.event_name == 'pull_request'
        env:
          AIDD_DIFF_RANGE: "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # PR 제목·본문을 loc_ok 판정용 메시지로 넘긴다 (셸 보간 금지 — env 경유)
          printf '%s\n\n%s\n' "$PR_TITLE" "$PR_BODY" > /tmp/pr-message.txt
          .claude/hooks/check-diff-size.sh /tmp/pr-message.txt

      - name: "[FR-8.1] TruffleHog 시크릿 스캔"
        # trufflehog 는 v3 같은 메이저 이동 태그를 제공하지 않는다.
        # 존재하지 않는 ref 를 쓰면 액션 해석 단계에서 job 이 즉시 실패한다.
        uses: trufflesecurity/trufflehog@v3.96.0
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha || 'HEAD~1' }}
          head: ${{ github.sha }}
          extra_args: --only-verified

  # ────────────────────────────────────────
  # Python 스택
  # ────────────────────────────────────────
  python:
    name: "Python — Lint · Type · Security · Test · Mutation"
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.python == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install uv + deps
        run: pip install uv && uv sync --all-extras

      - name: "[convention-py] ruff lint"
        run: uv run ruff check src/ tests/

      - name: "[convention-py] ruff format check"
        run: uv run ruff format --check src/ tests/

      - name: "[convention-py] mypy strict"
        run: uv run mypy src/ --strict

      - name: "[FR-8.1] bandit 보안 분석"
        run: uv run bandit -r src/ -ll -x tests/

      - name: "[FR-8.4] Safety 의존성 취약점"
        # 🔴 결함 조치 — `uv run pip install safety` 는 safety 를 **프로젝트 venv 안에**
        # 설치해, safety 자신의 전이 의존성까지 그 환경에 섞인다. `uv run safety check`
        # 는 그 환경 전체를 스캔하므로 safety 의 의존성을 "우리 프로젝트 의존성"으로
        # 오인해 스캔한다 — 실측 사례: 어떤 프로젝트의 pyproject.toml/uv.lock 에도 없는
        # `nltk`(SFTY-20260902-58666, Path Traversal)가 이 경로로만 들어와 그 버전에
        # PyPI 상 더 높은 버전이 없을 때 업그레이드로도 피할 수 없는 상시 실패를 만든다.
        # `uvx` 로 safety 를 격리 실행하고, 스캔 대상을 `uv export` 가 뽑은 **우리 의존성
        # 목록**(requirements.txt)으로 좁혀 safety 자신의 의존성이 섞이지 않게 한다.
        # `uv export` 는 `uv.lock` 이 없으면 그 자리에서 lock 을 새로 만들어 내보내므로
        # lock 유무와 무관하게 동작한다.
        run: |
          uv export --format requirements-txt --all-extras --no-hashes > /tmp/requirements.txt
          uvx safety check -r /tmp/requirements.txt --full-report
        continue-on-error: false

      - name: "[FR-8.4] Snyk 의존성 취약점"
        if: env.SNYK_TOKEN != ''
        run: snyk test --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        continue-on-error: true

      - name: "[FR-4.3] pytest + coverage (≥80%)"
        run: |
          uv run pytest \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=${{ env.COVERAGE_THRESHOLD }}

      - name: "[mutation] mutmut 뮤테이션 테스트"
        run: |
          uv run mutmut run --paths-to-mutate=src/ || true
          uv run mutmut results
        continue-on-error: true

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
        continue-on-error: true

  # ────────────────────────────────────────
  # TypeScript 스택
  # ────────────────────────────────────────
  typescript:
    name: "TypeScript — Lint · Type · Security · Test · Mutation"
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.node == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install deps
        run: |
          if [ -f "pnpm-lock.yaml" ]; then
            npm install -g pnpm && pnpm install --frozen-lockfile
          else
            npm ci
          fi

      - name: "[convention-ts] biome lint + format"
        run: |
          if [ -f "pnpm-lock.yaml" ]; then
            pnpm biome check src/
          else
            npx biome check src/
          fi

      - name: "[convention-ts] tsc strict"
        run: npx tsc --noEmit

      - name: "[FR-8.4] npm audit"
        run: npm audit --audit-level=high

      - name: "[FR-8.4] Snyk 의존성 취약점"
        if: env.SNYK_TOKEN != ''
        run: snyk test --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        continue-on-error: true

      - name: "[FR-4.3] vitest + coverage (≥80%)"
        run: |
          npx vitest run \
            --coverage \
            --coverage.thresholds.lines=${{ env.COVERAGE_THRESHOLD }} \
            --coverage.thresholds.functions=${{ env.COVERAGE_THRESHOLD }} \
            --coverage.thresholds.branches=${{ env.COVERAGE_THRESHOLD }}

      - name: "[mutation] Stryker 뮤테이션 테스트"
        run: npx stryker run
        continue-on-error: true

  # ────────────────────────────────────────
  # Java 스택 (S010 결정: 이연 — 비활성)
  # 활성화: 리포 변수 ENABLE_JAVA_CI=true 설정
  # ────────────────────────────────────────
  java:
    name: "Java — Lint · Type · Security · Test · Mutation (이연)"
    runs-on: ubuntu-latest
    needs: detect
    if: vars.ENABLE_JAVA_CI == 'true' && needs.detect.outputs.java == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: "Maven verify (compile + test)"
        run: mvn verify -B

      - name: "Checkstyle + SpotBugs + PMD"
        run: mvn -B -DskipTests checkstyle:check spotbugs:check pmd:check

      - name: "[FR-8.4] Snyk Java 취약점"
        if: env.SNYK_TOKEN != ''
        run: snyk test --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        continue-on-error: true

      - name: "[FR-4.3] PIT 뮤테이션 + 커버리지 (≥80%)"
        run: mvn pitest:mutationCoverage -B

  # ────────────────────────────────────────
  # 결과 게이트 (모든 필수 잡 통과 필요)
  # ────────────────────────────────────────
  ci-gate:
    name: "CI Gate — All Required Jobs"
    runs-on: ubuntu-latest
    needs: [security-scan]
    if: always()
    steps:
      - name: Check required jobs
        run: |
          if [[ "${{ needs.security-scan.result }}" != "success" ]]; then
            echo "❌ security-scan 실패"
            exit 1
          fi
          echo "✅ 필수 게이트 통과"
